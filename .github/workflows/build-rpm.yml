name: Build RPM and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        el: [8, 9, 10]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set container image
        id: container
        run: |
          if [ "${{ matrix.el }}" = "10" ]; then
            echo "image=quay.io/rockylinux/rockylinux:10" >> $GITHUB_OUTPUT
          else
            echo "image=rockylinux:${{ matrix.el }}" >> $GITHUB_OUTPUT
          fi

      - name: Build RPM in container
        run: |
          docker run --rm --platform linux/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ steps.container.outputs.image }} bash -c '
              dnf install -y rpm-build rpmdevtools golang git systemd-rpm-macros
              mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              cp SPECS/GoBGP.spec ~/rpmbuild/SPECS/
              cp SOURCES/* ~/rpmbuild/SOURCES/
              cd ~/rpmbuild
              spectool -g -R SPECS/GoBGP.spec
              rpmbuild -ba SPECS/GoBGP.spec
              cp RPMS/*/*.rpm /workspace/
            '

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-el${{ matrix.el }}-${{ matrix.arch }}
          path: "*.rpm"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpms
          pattern: rpm-*
          merge-multiple: true

      - name: Create yum repository
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c
          mkdir -p repo/{8,9,10}
          cp rpms/*el8*.rpm repo/8/
          cp rpms/*el9*.rpm repo/9/
          cp rpms/*el10*.rpm repo/10/
          cp GoBGP.repo repo/
          for version in 8 9 10; do
            createrepo_c repo/$version/
          done

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

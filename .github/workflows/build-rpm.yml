name: Build RPM and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build RPM in container
        run: |
          docker run --rm --platform linux/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            rockylinux:9 bash -c '
              dnf install -y rpm-build rpmdevtools golang git systemd-rpm-macros
              mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              cp SPECS/GoBGP.spec ~/rpmbuild/SPECS/
              cp SOURCES/* ~/rpmbuild/SOURCES/
              cd ~/rpmbuild
              spectool -g -R SPECS/GoBGP.spec
              rpmbuild -ba SPECS/GoBGP.spec
              cp RPMS/*/*.rpm /workspace/
            '

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: "*.rpm"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpms
          pattern: rpm-*
          merge-multiple: true

      - name: Create yum repository
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c
          mkdir -p repo
          cp rpms/*.rpm repo/
          cp GoBGP.repo repo/
          createrepo_c repo/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
